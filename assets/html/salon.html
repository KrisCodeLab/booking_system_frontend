<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/salon.css">
    <script src="../js/salon.js" type="module" defer></script>
    <title>Salonübersicht | Schnittpunkt</title>
</head>
<body>
    <header>
        <nav id="navbar">
            <a id="logo" href="index.html">
                <h2>Schnitt<span>punkt</span></h2>
            </a>

            <div id="navLinks">
                <a href="../../index.html">Kundenbereich</a>
                <a href="#" aria-current="page">Terminübersicht</a>
                <a href="#">Neue Leistung anlegen</a>
            </div>
        </nav>
    </header>
    <main>
        <section id="salonOverview">
            <div id="dayNavigation">
                <h1 id="selectedDate"></h1>
                <div>
                    <button type="button" id="previousDay">&lt; Zurück</button>
                    <button type="button" id="today">Heute</button>
                    <button type="button" id="nextDay">Weiter &gt;</button>
                </div>
            </div>

            <div id="calendar">
                <div id="calendarHeader">
                    <div></div>
                    <div>Sabine</div>
                    <div>Mara</div>
                    <div>Jonas</div>
                </div>

                <div id="calendarBody">
                    <div id="timeColumn">
                        <div>09:00</div>
                        <div>09:30</div>
                        <div>10:00</div>
                        <div>10:30</div>
                        <div>11:00</div>
                        <div>11:30</div>
                        <div>12:00</div>
                        <div>12:30</div>
                        <div>13:00</div>
                        <div>13:30</div>
                        <div>14:00</div>
                        <div>14:30</div>
                        <div>15:00</div>
                        <div>15:30</div>
                        <div>16:00</div>
                        <div>16:30</div>
                        <div>17:00</div>
                        <div>17:30</div>
                        <div>18:00</div>
                    </div>

                    
                    <div class="employeeColumn" id="1"> </div>

                    <div class="employeeColumn" id="2"></div>

                    <div class="employeeColumn" id="3"></div>
                </div>
            </div>

            <div id="legend">
                <span><i class="booked"></i> gebucht</span>
                <span><i class="completed"></i> erledigt</span>
                <span><i class="cancelled"></i> storniert</span>
            </div>
        </section>
    </main>
</body>
</html>
